services:
  knowledge-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: knowledge-server:latest
    container_name: knowledge-server
    restart: unless-stopped
    ports:
      - "${PORT:-443}:443"
    environment:
      - PORT=443
      - ACTIONDOCK_TOKEN=${ACTIONDOCK_TOKEN:?ACTIONDOCK_TOKEN is required}
      - ACTIONDOCK_AGENT_TOKEN=${ACTIONDOCK_AGENT_TOKEN:?ACTIONDOCK_AGENT_TOKEN is required}
      - WORKSPACE_ROOT=/srv/workspace
      - KNOWLEDGE_INBOX_ROOT=/srv/knowledge-inbox
      - GIT_BLOBLESS_FETCH=true
    volumes:
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./server:/app/server:ro
      # 代码工程工作区 (统一基于 KNOWLEDGE_DATA_DIR 自动衍生，不给单独自定义)
      - ${KNOWLEDGE_DATA_DIR:-/data/knowledge}/workspace:/srv/workspace
      # Knowledge Inbox 待审与归档候选池
      - ${KNOWLEDGE_DATA_DIR:-/data/knowledge}/inbox:/srv/knowledge-inbox
      # 宿主机 SSH 密钥 (用于向 Git 代码仓免密拉取与推送)
      - ${SSH_DIR:-/root/.ssh}:/root/.ssh:ro
      # 仓库清单配置文件目录 (包含 repos.json)
      - ${KNOWLEDGE_DATA_DIR:-/data/knowledge}/config:/etc/actiondock
      # 可选的正式 TLS 证书目录 (cert.pem 和 key.pem)
      - ${KNOWLEDGE_DATA_DIR:-/data/knowledge}/certs:/etc/actiondock/certs:ro
      # 维护与系统日志目录
      - ${KNOWLEDGE_DATA_DIR:-/data/knowledge}/logs:/var/log/actiondock
      # 本地沙盒 Git 裸仓远端目录
      - ${KNOWLEDGE_DATA_DIR:-/data/knowledge}/remotes:/data/knowledge/remotes
